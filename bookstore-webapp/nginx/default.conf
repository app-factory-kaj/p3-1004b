server {
    listen 9090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request-time DNS so nginx starts if the sibling API Service is not up yet
    # (browser /api then 502s; the pod does not crash-loop).
    resolver __DNS_RESOLVERS__ valid=10s ipv6=off;

    location /api/ {
        set $api_backend __API_BACKEND__;

        # The context prefix MUST survive the rewrite. When /api is proxied to
        # the API gateway, the gateway routes on that prefix and dropping it
        # 404s every call. Empty for a direct-Service backend, which reduces
        # this to the plain `/$1` strip.
        rewrite ^/api/(.*) __API_CONTEXT__/$1 break;

        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $api_backend;
        proxy_set_header Connection "";

        # Identity is the gateway's to assert, never the browser's. Clearing
        # these means a client cannot pre-set an identity header and have the
        # backend — which is required to trust them — believe it. Setting a
        # proxy header to "" drops it from the upstream request.
        #
        # x-jwt-assertion is the one the service actually believes: it is the
        # gateway-signed statement of who the caller is. A browser cannot forge
        # one (it is signed with a key only the gateway holds) but it can
        # REPLAY one it was somehow handed, and on a PUBLIC operation the
        # gateway overwrites nothing. Clearing it here means the only assertion
        # that reaches the service is the one the gateway minted for this
        # request.
        proxy_set_header x-jwt-assertion "";

        # The X-User-* headers are unsigned, and no generated service reads
        # them any more. They are still cleared, because this proxy is a lane
        # into the service that the API gateway does not sit on and nothing
        # should be able to put an identity on it.
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # A chat turn to an agent can carry files: 15 MiB of them is 20 MiB
        # base64, plus framing. nginx's 1 MiB default would 413 a single photo.
        client_max_body_size 24m;
    }

    location /api/customers-service/ {
        set $customers_service_backend __CUSTOMERS_SERVICE_BACKEND__;
        rewrite ^/api/customers-service/(.*) __CUSTOMERS_SERVICE_CONTEXT__/$1 break;
        proxy_pass http://$customers_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $customers_service_backend;
        proxy_set_header Connection "";
        proxy_set_header x-jwt-assertion "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 24m;
    }

    location /api/cart-service/ {
        set $cart_service_backend __CART_SERVICE_BACKEND__;
        rewrite ^/api/cart-service/(.*) __CART_SERVICE_CONTEXT__/$1 break;
        proxy_pass http://$cart_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $cart_service_backend;
        proxy_set_header Connection "";
        proxy_set_header x-jwt-assertion "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 24m;
    }

    location /api/orders-service/ {
        set $orders_service_backend __ORDERS_SERVICE_BACKEND__;
        rewrite ^/api/orders-service/(.*) __ORDERS_SERVICE_CONTEXT__/$1 break;
        proxy_pass http://$orders_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $orders_service_backend;
        proxy_set_header Connection "";
        proxy_set_header x-jwt-assertion "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 24m;
    }

    location /api/inventory-service/ {
        set $inventory_service_backend __INVENTORY_SERVICE_BACKEND__;
        rewrite ^/api/inventory-service/(.*) __INVENTORY_SERVICE_CONTEXT__/$1 break;
        proxy_pass http://$inventory_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $inventory_service_backend;
        proxy_set_header Connection "";
        proxy_set_header x-jwt-assertion "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 24m;
    }

    location /api/notifications-service/ {
        set $notifications_service_backend __NOTIFICATIONS_SERVICE_BACKEND__;
        rewrite ^/api/notifications-service/(.*) __NOTIFICATIONS_SERVICE_CONTEXT__/$1 break;
        proxy_pass http://$notifications_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $notifications_service_backend;
        proxy_set_header Connection "";
        proxy_set_header x-jwt-assertion "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Ou "";
        proxy_set_header X-User-Scopes "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 24m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
