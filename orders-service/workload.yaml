apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: orders-service

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: p3-1004b-cart-service
      name: http
      visibility: project
      envBindings:
        address: CART_SERVICE_URL
    - component: p3-1004b-inventory-service
      name: http
      visibility: project
      envBindings:
        address: INVENTORY_SERVICE_URL
    - component: p3-1004b-customers-service
      name: http
      visibility: project
      envBindings:
        address: CUSTOMERS_SERVICE_URL
    - component: p3-1004b-notifications-service
      name: http
      visibility: project
      envBindings:
        address: NOTIFICATIONS_SERVICE_URL
  resources:
    - ref: p3-1004b-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
